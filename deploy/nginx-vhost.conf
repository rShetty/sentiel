# Sentiel production reverse proxy — PRODUCTION CUTOVER
#
# Per docs/MIGRATION_GOALS.md (Governance Hub) production cutover checklist:
# "Keep / dashboard internal-only; keep health/metrics/API endpoints for
# services."
#
# The dashboard is limited to the Tailscale tailnet (100.64.0.0/10).
# Health, metrics, and API endpoints stay reachable for services. The Hub
# proxies Sentiel server-side over 127.0.0.1:8585.

server {
    listen 80;
    server_name sentiel.rajeev.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sentiel.rajeev.me;

    ssl_certificate     /etc/letsencrypt/live/sentiel.rajeev.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sentiel.rajeev.me/privkey.pem;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Health/metrics/API endpoints for services.
    location ~ ^/(health|metrics|api)(/|$) {
        proxy_pass http://127.0.0.1:8585;
    }

    # Dashboard and operator UI — tailnet only.
    location / {
        allow 100.64.0.0/10;
        deny all;
        proxy_pass http://127.0.0.1:8585;
    }
}
