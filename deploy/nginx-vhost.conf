# Sentiel production reverse proxy — PRODUCTION CUTOVER
#
# Per docs/MIGRATION_GOALS.md (Governance Hub) production cutover checklist:
# "Keep / dashboard internal-only; keep health/metrics/API endpoints for
# services."
#
# Sentiel has no public DNS record or TLS certificate, so this vhost is
# plain HTTP on the host. Health, metrics, and API endpoints stay reachable
# for services; the dashboard is limited to the Tailscale tailnet
# (100.64.0.0/10). The Hub proxies Sentiel server-side over 127.0.0.1:8585.

server {
    listen 80;
    server_name sentiel.rajeev.me;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Health/metrics/API endpoints for services.
    location ~ ^/(health|metrics|api)(/|$) {
        proxy_pass http://127.0.0.1:8585;
    }

    # Dashboard and operator UI — tailnet only.
    location / {
        allow 100.64.0.0/10;
        deny all;
        proxy_pass http://127.0.0.1:8585;
    }
}
