[server]
host = "0.0.0.0"
port = 8585
# Maximum accepted request body size (bytes). Larger requests get 413.
max_payload_bytes = 262144

[database]
path = "/var/lib/sentiel/sentiel.db"
# Delete events/alerts older than this many days (background + admin endpoint).
retention_days = 90
# Seconds between background pruning passes.
prune_interval_secs = 3600
# Tamper-evident storage: hash-chain every event row and verify via
# GET /api/integrity (admin). Adds SHA-256 hashing per insert.
chain_events = true

[dlp]
enabled = true
# Reject (HTTP 403) events whose worst DLP violation is at or above
# `block_severity`. Set to false to record violations but store the event.
block_on_violation = true
block_severity = "critical"
# Cap on DLP violations recorded per event.
max_redactions = 100

[anomaly]
spending_spike_threshold = 5.0
denial_rate_threshold = 0.5
off_hours_start = 22
off_hours_end = 6
